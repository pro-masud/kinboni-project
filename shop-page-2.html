<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=shop.html?page=2#products" />
    <title>Shop page 2 | Kinboni</title>
    <script>
      const destination = new URL("shop.html", window.location.href);
      const query = new URLSearchParams(window.location.search);
      query.set("page", "2");
      destination.search = query.toString();
      destination.hash = "products";
      window.location.replace(destination.href);
    </script>
      <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <p>
        Opening page 2 of the Kinboni shop.
        <a href="shop.html?page=2#products">Continue to the shop</a>
      </p>
    </main>
  </body>
</html>
